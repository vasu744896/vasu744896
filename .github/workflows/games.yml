# ══════════════════════════════════════════════════════════
#  🎮 GAME ZONE WORKFLOW (FIXED)
#  Path in your profile repo:  .github/workflows/games.yml
#
#  Setup checklist:
#  1. Repo Settings → Actions → General → Workflow permissions
#     → select "Read and write permissions" → Save
#  2. Actions tab → "🎮 Generate Game Animations" → Run workflow
#  3. Wait ~1-2 min, then hard-refresh your profile (Ctrl+Shift+R)
# ══════════════════════════════════════════════════════════

name: 🎮 Generate Game Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ─── 🐍 Snake → writes into dist/ ───
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: vasu744896
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ─── 👾 Pac-Man + 🧱 Breakout → both write into dist/ ───
      - name: Generate arcade games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: vasu744896
          games: 'pacman,breakout'

      # ─── 🚀 Push everything in dist/ to the output branch ONCE ───
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}